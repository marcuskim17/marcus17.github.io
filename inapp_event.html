<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IAP Test</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 14px;
        background:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.15), transparent 30%),
          linear-gradient(180deg, #f8fbff 0%, #eef6ff 100%);
        color: #11213d;
      }

      .page {
        max-width: 720px;
        margin: 0 auto;
        min-height: 100vh;
        padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
        display: flex;
        align-items: center;
      }

      .card {
        width: 100%;
        padding: 24px;
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.08);
      }

      .eyebrow {
        display: inline-block;
        margin-bottom: 12px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(14, 165, 233, 0.12);
        color: #0369a1;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.55rem, 4.8vw, 2.35rem);
        line-height: 1.05;
      }

      p {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.6;
        color: #52627d;
      }

      .form-grid {
        display: grid;
        gap: 16px;
        margin: 20px 0 20px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 700;
        color: #1e3a5f;
      }

      .text-input,
      .text-area {
        width: 100%;
        border: 1px solid #bfdbfe;
        border-radius: 16px;
        padding: 14px 16px;
        font: inherit;
        font-size: 0.95rem;
        color: #11213d;
        background: #fff;
      }

      .text-area {
        min-height: 140px;
        resize: vertical;
      }

      .event-preview {
        margin: 0 0 24px;
        padding: 16px;
        border-radius: 18px;
        background: #eff6ff;
        color: #1e3a8a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
        line-height: 1.6;
        white-space: pre-wrap;
        overflow-x: auto;
      }

      #button {
        width: 100%;
        min-height: 64px;
        border: 0;
        border-radius: 18px;
        background: linear-gradient(135deg, #0284c7, #2563eb);
        color: #fff;
        font-size: 0.96rem;
        font-weight: 700;
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.24);
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
        touch-action: manipulation;
      }

      #button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <span class="eyebrow">Webview Test</span>
        <h1>Record In-App Event</h1>
        <p>Enter your event details, review the live preview, and then trigger the AppsFlyer in-app event call.</p>
        <div class="form-grid">
          <div class="field">
            <label for="event-name">Event Name</label>
            <input id="event-name" class="text-input" type="text" value="af_purchase" placeholder="af_purchase">
          </div>
          <div class="field">
            <label for="event-value">Event Value</label>
            <textarea id="event-value" class="text-area" placeholder="{&quot;af_revenue&quot;:&quot;6.72&quot;}">{&quot;af_revenue&quot;:&quot;6.72&quot;, &quot;af_content_type&quot;: &quot;wallets&quot;, &quot;af_content_id&quot;: &quot;15854&quot;}</textarea>
          </div>
        </div>
        <pre id="event-preview" class="event-preview"></pre>
        <div id="main">
          <button id="button" type="button">Record Event</button>
        </div>
      </section>
    </main>
    <script type="text/javascript">
      var BUTTON_LABEL_IDLE = "Record Event";
      var BUTTON_LABEL_SUCCESS = "Event sent successfully";
      var BUTTON_LABEL_FAILURE = "Not working";
      function setButtonLabel(label) {
        button.textContent = label;
      }

      function setEventStatus(label) {
        setButtonLabel(label);
      }

      function resetButtonState() {
        setEventStatus(BUTTON_LABEL_IDLE);
      }

      function recordEvent(eventName, eventValue) {
        var encodedEventName = encodeURIComponent(eventName);
        var encodedEventValue = encodeURIComponent(eventValue);
        var schemeUrl = "af-event://inappevent?eventName=" + encodedEventName + "&eventValue=" + encodedEventValue;
        var iframe = document.createElement("iframe");

        iframe.style.display = "none";
        iframe.setAttribute("src", schemeUrl);
        document.documentElement.appendChild(iframe);
        iframe.parentNode.removeChild(iframe);
      }

      var button = document.getElementById("button");
      var eventNameInput = document.getElementById("event-name");
      var eventValueInput = document.getElementById("event-value");
      var eventPreview = document.getElementById("event-preview");

      function updatePreview() {
        var eventName = eventNameInput.value || "(empty)";
        var eventValue = eventValueInput.value || "(empty)";
        eventPreview.textContent = "eventName: " + eventName + "\n" +
          "eventValue: " + eventValue;
      }

      eventNameInput.addEventListener("input", updatePreview);
      eventValueInput.addEventListener("input", updatePreview);

      function handleRecordEvent() {
        if (button.textContent !== BUTTON_LABEL_IDLE) {
          resetButtonState();
          return;
        }

        var eventName = eventNameInput.value;
        var eventValue = eventValueInput.value;

        try {
          JSON.parse(eventValue);
          recordEvent(eventName, eventValue);
          setEventStatus(BUTTON_LABEL_SUCCESS);
        } catch (error) {
          setEventStatus(BUTTON_LABEL_FAILURE);
        }
      }

      button.addEventListener("click", handleRecordEvent);
      button.addEventListener("touchend", function(event) {
        event.preventDefault();
        handleRecordEvent();
      });

      setButtonLabel(BUTTON_LABEL_IDLE);
      updatePreview();
    </script>
  </body>
</html>
