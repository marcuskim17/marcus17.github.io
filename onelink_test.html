<!doctype html>
<html lang="en-us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="css/styles.css" rel="stylesheet">
    <title>OneLink Test</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top, rgba(34, 197, 94, 0.15), transparent 30%),
                linear-gradient(180deg, #f8fff8 0%, #eefbf2 100%);
            color: #16311e;
        }

        .page {
            max-width: 760px;
            margin: 0 auto;
            min-height: 100vh;
            padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
        }

        .hero {
            margin-bottom: 20px;
        }

        .eyebrow {
            display: inline-block;
            margin-bottom: 12px;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.14);
            color: #15803d;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            line-height: 1.6;
            color: #4d6354;
        }

        .link-grid {
            display: grid;
            gap: 16px;
            margin-top: 22px;
        }

        .link-card {
            display: block;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.92);
            color: inherit;
            text-decoration: none;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.12);
            word-break: break-word;
        }

        .link-card strong {
            display: block;
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        .link-card span {
            color: #5d6e62;
            line-height: 1.5;
        }
    </style>
</head>

<body>
    <main class="page">
      <section class="hero">
        <span class="eyebrow">Deep Link Test</span>
        <h1>OneLink Targets</h1>
        <p>Use these links to validate redirect behavior in a browser or embedded webview.</p>
      </section>

      <section class="link-grid">
        <a class="link-card" href="https://www.google.com">
          <strong>Google</strong>
          <span>Baseline external link for quick browser behavior checks.</span>
        </a>
        <a class="link-card" href="https://baeminkr.onelink.me/XgL8/dgomf9ci">
          <strong>AppsFlyer OneLink</strong>
          <span>https://baeminkr.onelink.me/XgL8/dgomf9ci</span>
        </a>
      </section>
    </main>
</body>

</html>
